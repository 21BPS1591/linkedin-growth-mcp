[project]
name = "linkedin-growth-mcp"
version = "0.1.0"
description = "Self-built MCP server: profile-aware LinkedIn post drafting, Gemini images, approval-gated publishing, and a performance-driven style bandit."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "patchright>=1.50",
    "google-genai>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "uvicorn>=0.30",
    "pypdf>=6.21.2",
    "python-dateutil>=3.0.0",
    "pypdfium2>=5.14.0",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "rapidocr-onnxruntime>=1.4.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
linkedin-growth-mcp = "linkedin_growth_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_growth_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
